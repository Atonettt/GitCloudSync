name: Windows

on:
  push:
    branches: [windows]
    paths: ["Windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Windows
    env:
      GITSYNC_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Configure Git for the tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global core.autocrlf false

      - name: Test the sync core
        run: dotnet test tests/GitSync.Core.Tests --logger "console;verbosity=minimal"

      - name: Publish the app (x64 and ARM64)
        run: |
          dotnet publish src/GitSync.App -c Release -r win-x64 -p:Platform=x64 --self-contained -p:PublishReadyToRun=true -o publish/x64
          dotnet publish src/GitSync.App -c Release -r win-arm64 -p:Platform=ARM64 --self-contained -p:PublishReadyToRun=true -o publish/arm64

      - name: Start the app once (smoke test)
        shell: pwsh
        run: |
          Get-ChildItem publish\x64\*.pri | Format-Table Name, Length
          $p = Start-Process -FilePath publish\x64\GitSync.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Write-Host "GitSync exited with code $($p.ExitCode)"
            $log = Join-Path $env:LOCALAPPDATA "GitSync\crash.log"
            if (Test-Path $log) { Get-Content $log }
            Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in ".NET Runtime", "Application Error" } | Select-Object -First 5 | ForEach-Object { $_.Message }
            exit 1
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $bitmap.Save("$PWD\artifacts\screenshot.png")
          Stop-Process -Id $p.Id -Force
          $log = Join-Path $env:LOCALAPPDATA "GitSync\crash.log"
          if (Test-Path $log) { Write-Host "crash.log:"; Get-Content $log }
          Write-Host "GitSync started and kept running."

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: Windows/artifacts/screenshot.png

      - name: Build the installers
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($arch in "x64", "arm64") {
            $env:GITSYNC_ARCH = $arch
            & $iscc installer\GitSync.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Compress-Archive -Path publish\x64\* -DestinationPath artifacts\GitSync-portable-x64.zip
          Get-ChildItem artifacts | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: GitSync-Windows
          path: Windows/artifacts/*
